<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2daff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="200" fill="#7a51e0" opacity="0.06"/>
  <circle cx="150" cy="530" r="160" fill="#7a51e0" opacity="0.06"/>

  <!-- Logo icon -->
  <rect x="80" y="180" width="72" height="72" rx="18" fill="#7a51e0"/>
  <path d="M104 204h24v6h-24zm0 12h24v6h-24zm0 12h18v6h-18z" fill="#fff"/>

  <!-- Logo text -->
  <text x="168" y="236" font-family="sans-serif" font-weight="700" font-size="56" fill="#7a51e0">Belt</text>

  <!-- Headline -->
  <text x="80" y="340" font-family="sans-serif" font-weight="700" font-size="52" fill="#000000">Attendance via WhatsApp.</text>
  <text x="80" y="404" font-family="sans-serif" font-weight="700" font-size="52" fill="#7a51e0">That simple.</text>

  <!-- Subtitle -->
  <text x="80" y="470" font-family="sans-serif" font-weight="400" font-size="24" fill="#555555">Your instructors send student names on WhatsApp.</text>
  <text x="80" y="502" font-family="sans-serif" font-weight="400" font-size="24" fill="#555555">Belt does the rest.</text>

  <!-- WhatsApp badge -->
  <rect x="80" y="536" width="200" height="48" rx="24" fill="#25D366"/>
  <text x="130" y="567" font-family="sans-serif" font-weight="600" font-size="18" fill="#ffffff">WhatsApp-based</text>

  <!-- Phone mockup (simplified) -->
  <rect x="820" y="100" width="280" height="460" rx="32" fill="#222" stroke="#333" stroke-width="2"/>
  <rect x="832" y="130" width="256" height="400" rx="4" fill="#ece5dd"/>

  <!-- Phone header -->
  <rect x="832" y="130" width="256" height="48" fill="#075e54"/>
  <circle cx="862" cy="154" r="14" fill="#7a51e0"/>
  <text x="858" y="159" font-family="sans-serif" font-weight="700" font-size="14" fill="#fff">B</text>
  <text x="884" y="159" font-family="sans-serif" font-weight="600" font-size="16" fill="#fff">Belt</text>

  <!-- Chat bubbles -->
  <rect x="900" y="196" width="172" height="40" rx="8" fill="#dcf8c6"/>
  <text x="912" y="216" font-family="sans-serif" font-size="12" fill="#333">João, Maria, Pedro, Ana</text>
  <text x="1048" y="230" font-family="sans-serif" font-size="9" fill="#888">10:32</text>

  <rect x="848" y="250" width="196" height="40" rx="8" fill="#fff"/>
  <text x="858" y="266" font-family="sans-serif" font-size="11" fill="#333">&#x2713; 4 students recorded</text>
  <text x="858" y="282" font-family="sans-serif" font-size="9" fill="#888">10:32</text>

  <rect x="968" y="304" width="104" height="32" rx="8" fill="#dcf8c6"/>
  <text x="1004" y="324" font-family="sans-serif" font-size="13" fill="#333">#a</text>
  <text x="1048" y="330" font-family="sans-serif" font-size="9" fill="#888">10:33</text>

  <rect x="848" y="350" width="220" height="120" rx="8" fill="#fff"/>
  <text x="858" y="370" font-family="sans-serif" font-size="11" fill="#333">&#x1F4CA; Monthly attendance:</text>
  <text x="858" y="390" font-family="sans-serif" font-size="11" fill="#555">João: 12 classes</text>
  <text x="858" y="408" font-family="sans-serif" font-size="11" fill="#555">Maria: 10 classes</text>
  <text x="858" y="426" font-family="sans-serif" font-size="11" fill="#555">Pedro: 8 classes</text>
  <text x="858" y="444" font-family="sans-serif" font-size="11" fill="#555">Ana: 15 classes</text>
  <text x="858" y="462" font-family="sans-serif" font-size="9" fill="#888">10:33</text>
</svg>
